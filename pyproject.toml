[project]
name = "mempulse"
version = "0.1.0"
description = "Real-time terminal visualizer for Linux virtual and physical memory layout"
readme = "README.md"
authors = [
    { name = "Pablo Vallespín Aranguren", email = "pablopva014@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
mempulse = "mempulse.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001: box-drawing glyphs are the point of this app. RUF012: Textual BINDINGS idiom.
ignore = ["RUF001", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
